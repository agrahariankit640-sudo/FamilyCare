<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found - FamilyCare</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-secondary); }
        .error-container { text-align: center; max-width: 500px; padding: 2rem; }
        .error-code { font-size: 8rem; font-weight: bold; color: var(--primary-color); line-height: 1; margin-bottom: 1rem; }
        .error-title { font-size: 2rem; color: var(--text-primary); margin-bottom: 1rem; }
        .error-message { color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem; }
        .error-actions { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="flex justify-center mb-6">
            <div class="flex items-center gap-2 text-xl font-bold text-primary">
                <i data-lucide="heart-pulse"></i>
                FamilyCare
            </div>
        </div>
        
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
        
        <div class="error-actions">
            {% if current_user.is_authenticated %}
            <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
            {% else %}
            <a href="/" class="btn btn-primary">Go Home</a>
            <a href="/login" class="btn btn-outline">Login</a>
            {% endif %}
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
