<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Register - FamilyCare</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-secondary); padding: 2rem 0; }
        .auth-container { width: 100%; max-width: 500px; padding: 0 2rem; }
        .auth-card { background: var(--bg-primary); padding: 2.5rem; border-radius: 12px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
        .auth-logo { text-align: center; margin-bottom: 2rem; font-size: 1.5rem; font-weight: bold; color: var(--primary-color); display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
        .auth-card h2 { text-align: center; margin-bottom: 1.5rem; color: var(--text-primary); }
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary); }
        .form-control { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-primary); color: var(--text-primary); }
        .password-input-group { position: relative; }
        .password-toggle { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); cursor: pointer; }
        .btn-block { width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 1rem; }
        .auth-links { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .auth-links a { color: var(--primary-color); text-decoration: none; }
        .auth-links a:hover { text-decoration: underline; }
        #error-message { color: var(--danger-color); font-size: 0.9rem; margin-bottom: 1rem; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i data-lucide="heart-pulse"></i>
                FamilyCare
            </div>
            <h2>Create Your Account</h2>
            
            <form id="register-form">
                <div id="error-message"></div>
                
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number (Optional)</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1234567890">
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input-group">
                        <input type="password" id="password" name="password" class="form-control" required placeholder="Create a strong password">
                        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                    <!-- Password strength indicator placeholder -->
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <div class="password-input-group">
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Confirm your password">
                        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group flex items-start gap-2">
                    <input type="checkbox" id="privacy" name="privacy" required class="mt-1">
                    <label for="privacy" class="text-sm">I agree to the Privacy Policy and terms of service.</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
            
            <div class="auth-links">
                <p>Already have an account? <a href="/login">Login</a></p>
                <p class="mt-2"><a href="/">Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}?v=2"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
