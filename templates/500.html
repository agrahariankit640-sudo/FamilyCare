<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Internal Server Error - FamilyCare</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-secondary); }
        .error-container { text-align: center; max-width: 500px; padding: 2rem; }
        .error-icon { color: var(--danger-color); display: flex; justify-content: center; margin-bottom: 1rem; }
        .error-code { font-size: 6rem; font-weight: bold; color: var(--text-primary); line-height: 1; margin-bottom: 1rem; }
        .error-title { font-size: 2rem; color: var(--text-primary); margin-bottom: 1rem; }
        .error-message { color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="flex justify-center mb-6">
            <div class="flex items-center gap-2 text-xl font-bold text-primary">
                <i data-lucide="heart-pulse"></i>
                FamilyCare
            </div>
        </div>
        
        <div class="error-icon">
            <i data-lucide="alert-triangle" size="64"></i>
        </div>
        
        <div class="error-code">500</div>
        <h1 class="error-title">Something went wrong</h1>
        <p class="error-message">We're sorry, an unexpected internal error occurred. Our team has been notified.</p>
        
        <div class="flex justify-center mt-6">
            <button onclick="window.history.back()" class="btn btn-outline mr-4">Go Back</button>
            <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
